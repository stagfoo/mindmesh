name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        # Release, not debug: a debug build has no AOT snapshot and starts
        # several times slower, which for a launcher is the whole experience.
        # Signed with the committed debug.keystore either way.
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mindmesh-release-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
