name: mindmesh
description: "A situational Android launcher: nested contexts drawn as blurred circles, sized by how much you use them."
publish_to: 'none'

version: 1.0.10+11

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/grain.png

  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend[wght].ttf
